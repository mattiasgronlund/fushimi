[package]
name = "fushimi"
version = "0.1.0"
authors = ["Masashi Mizuno", "Mattias Grönlund"]
edition = "2021"
rust-version = "1.85.0"
description = "A Rust implementation of interval arithmetic"
readme = "README.md"
repository = "https://github.com/mattiasgronlund/fushimi"
license = "MIT"
keywords = ["arithmetic", "interval", "math", "numerics"]
categories = ["mathematics", "science"]
include = [
  "/examples/**",
  "/src/**",
  "/tests/**",
  "/build.rs",
  "/Cargo.toml",
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "src/_docs/header.html"]

[features]
default = []
# Use the portable backend (src/simd/generic.rs) on every architecture.
force-generic = []
# Adds the token `V4` (AVX-512) to `fushimi::simd`; needs Rust 1.89, where the AVX-512 target
# features are stable.
avx512 = []
# Not public API: exposes the SIMD primitives to the benchmarks in bench/.
__bench = []

[dependencies]
cfg-if = "1.0"
forward_ref = "1.0.0"

[dependencies.libm]
version = "0.2"
optional = true

[dependencies.nom]
version = "7.0"
default-features = false
features = ["std"]

# The tests compare fushimi's results with MPFR's, on the platforms where `gmp-mpfr-sys` builds
# GMP and MPFR. The test code that uses them is compiled under the same `cfg` expression.
[target.'cfg(all(target_pointer_width = "64", any(target_os = "linux", target_os = "macos")))'.dev-dependencies.gmp-mpfr-sys]
version = "1.5"
default-features = false
features = ["mpfr"]

[target.'cfg(all(target_pointer_width = "64", any(target_os = "linux", target_os = "macos")))'.dev-dependencies.rug]
version = "1.19"
default-features = false
features = ["float", "integer", "rational"]

[[example]]
name = "exp"
required-features = ["libm"]

[[example]]
name = "log"
required-features = ["libm"]
