name: ci-x86-64

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -Ctarget-cpu=haswell -Dwarnings
  RUSTFLAGS: -Ctarget-cpu=haswell -Dwarnings

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/gmp-mpfr-sys
          key: ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          profile: minimal
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Is AVX-512F available?
        id: avx512f
        run: lscpu | grep --quiet avx512f
        continue-on-error: true

      - name: Test
        run: cargo test --release

      # `V4::try_new` (`src/simd/token.rs`) returns a token only if the CPU has
      # each of these target features, named here as in /proc/cpuinfo, where
      # sse3 is `pni` and lzcnt is `abm`.
      - name: Does the CPU have the target features of `V4`?
        id: v4
        shell: bash
        run: |
          flags=" $(grep --max-count=1 '^flags' /proc/cpuinfo) "
          for f in avx avx2 avx512bw avx512cd avx512dq avx512f avx512vl bmi1 bmi2 \
                   f16c fma abm movbe popcnt pni sse4_1 sse4_2 ssse3; do
            if [[ "$flags" != *" $f "* ]]; then
              echo "The CPU does not have $f."
              exit 1
            fi
          done
        continue-on-error: true

      # `V4` and its tests exist only with the feature `avx512`.
      - name: Test (--features avx512)
        run: cargo test --release --features avx512

      # The tests `v4`, `dec_v4`, `classes_v4` and `differential_v4` print
      # "skipped" and pass where `V4::try_new` returns `None`. On a CPU with the
      # target features of `V4`, this step shows that they run.
      - name: V4 tests run, not skipped
        if: ${{ steps.v4.outcome == 'success' }}
        shell: bash
        run: |
          cargo test --release --lib --features avx512 v4 -- --nocapture 2>&1 | tee v4.log
          grep --quiet --extended-regexp '^running [1-9][0-9]* tests?$' v4.log
          if grep --quiet skipped v4.log; then
            echo "A test of V4 was skipped."
            exit 1
          fi

      - name: Test (target AVX-512F)
        run: cargo test --release --features avx512
        if: ${{ steps.avx512f.outcome == 'success' }}
        env:
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -Ctarget-feature=+avx512f
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -Ctarget-feature=+avx512f

      # A Nehalem has `sse4.2` but no `fma`, like `x86-64-v2`: `Interval` uses the
      # `sse42` backend, and each entry of the kernel of the elementary functions
      # (`src/dyadic`) picks its copy at run time (`src/dyadic/level.rs`). On a
      # runner whose CPU has FMA, this step runs the copies compiled with `fma`;
      # the `baseline` job runs the others in QEMU.
      - name: Test (target Nehalem)
        run: cargo test --release
        env:
          RUSTFLAGS: -Ctarget-cpu=nehalem -Dwarnings
          RUSTDOCFLAGS: -Ctarget-cpu=nehalem -Dwarnings

      - name: Test (--no-default-features)
        run: cargo test --release --no-default-features --lib --tests

      - name: Test (--features force-generic)
        run: cargo test --release --features force-generic

      - name: Clippy
        run: |
          cargo clippy --all-targets
          cargo clippy --all-targets --features avx512

      - name: Clippy (target AVX-512F)
        run: |
          cargo clippy --all-targets
          cargo clippy --all-targets --features avx512
        if: ${{ steps.avx512f.outcome == 'success' }}
        env:
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -Ctarget-feature=+avx512f
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -Ctarget-feature=+avx512f

      - name: Clippy (target Nehalem)
        run: |
          cargo clippy --all-targets
          cargo clippy --all-targets --features avx512
        env:
          RUSTFLAGS: -Ctarget-cpu=nehalem -Dwarnings
          RUSTDOCFLAGS: -Ctarget-cpu=nehalem -Dwarnings

      - name: Check format
        run: cargo fmt -- --check

      - name: Check docs
        run: |
          cargo rustdoc
          cargo rustdoc --features avx512

      # With `--cfg docsrs`, as on docs.rs, `src/simd.rs` selects the stubs in
      # `src/simd/unimplemented.rs`. Rustdoc does not report a call to a missing
      # function inside a function body, so `cargo rustdoc` passes when a stub is
      # missing. This step checks the crate with that configuration. Like docs.rs,
      # it passes `--cfg docsrs` to this crate alone: in `RUSTFLAGS` it would also
      # reach the dependencies, where a crate may use it to document an API of
      # another platform, which does not compile here.
      - name: Check docs.rs configuration
        run: cargo rustc --lib --all-features --profile check -- --cfg docsrs

  # A build for plain `x86-64`, the baseline every x86-64 CPU has. There
  # `Interval` uses the portable backend, and each entry of the kernel of the
  # elementary functions (`src/dyadic`) picks at run time between its copy
  # compiled with the target feature `fma` and its copy with Dekker's products
  # (`src/dyadic/level.rs`). On a runner whose CPU has FMA, `Test` runs the
  # first; the steps named "without FMA" run the second, and the last of them
  # does so in a build for a Nehalem, whose kernel picks its copy in the same way.
  baseline:
    # GitHub's Ubuntu 26.04 image installs the `amd64v3` builds of its packages
    # (for `x86-64-v3`): QEMU's Nehalem cannot run their dynamic loader, and
    # their `gcc` compiles for `x86-64-v3` by default. So this job runs in a
    # container of Docker Hub's `ubuntu` image, which installs the `amd64`
    # builds (for `x86-64`). Docker pulls the image by its digest and ignores
    # the tag. To update it, write the new tag and the Digest that
    # `docker buildx imagetools inspect ubuntu:<tag>` prints, and the new tag in
    # the cache key below.
    runs-on: ubuntu-latest
    container: ubuntu:26.04@sha256:d66b366dac61b575bee2aef07e9c26e8070096fbe84a3d4d3eb0da069b5d76db

    env:
      RUSTDOCFLAGS: -Ctarget-cpu=x86-64 -Dwarnings
      RUSTFLAGS: -Ctarget-cpu=x86-64 -Dwarnings

    steps:
      # The image has no gcc, make, git, curl or QEMU, and no `sudo`: the steps
      # run as root. m4 is for GMP's configure script, and curl for the script
      # at sh.rustup.rs, with which actions-rs installs rustup. This step comes
      # first, so that checkout finds git and actions/cache finds zstd.
      # `--no-install-recommends` also leaves out `qemu-user-binfmt`, which
      # registers QEMU with the kernel: the steps below run `qemu-x86_64` by
      # name.
      - name: Install gcc, git, curl and QEMU
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl git build-essential m4 zstd qemu-user
        env:
          DEBIAN_FRONTEND: noninteractive

      # The QEMU steps below run this container's dynamic loader and C library
      # (the step above can upgrade the image's), and the C code of GMP and
      # MPFR, which gcc compiles for its default `-march`. This step fails
      # before them if QEMU's Nehalem cannot run this container's `/bin/true`,
      # or if gcc's default `-march` is not `x86-64`.
      - name: Check that QEMU's Nehalem runs this userland
        run: |
          qemu-x86_64 --version
          qemu-x86_64 -cpu Nehalem /bin/true
          gcc -Q --help=target | grep -E -- '^[[:space:]]+-march=[[:space:]]+x86-64$'

      - uses: actions/checkout@v4

      # GMP and MPFR as gcc builds them in this container, under a key of their
      # own that names the image's tag, so that a new tag builds them again.
      # This workflow's other Linux jobs run on `ubuntu-latest`, now GitHub's
      # Ubuntu 26.04 image, whose `gcc` compiles for `x86-64-v3` by default, and
      # GMP and MPFR built there stop the QEMU steps below with SIGILL.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/gmp-mpfr-sys
          key: ${{ runner.os }}-baseline-ubuntu-26.04-${{ secrets.CACHE_VERSION }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-baseline-ubuntu-26.04-${{ secrets.CACHE_VERSION }}-

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          profile: minimal
          components: clippy

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.85.0
          profile: minimal

      # For `cargo +stable` below: GitHub's runner images come with a stable
      # Rust, and this container does not.
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Test (--no-default-features)
        run: cargo test --release --no-default-features --lib --tests

      # The tokens with the feature `avx512`, which adds `V4` and its copies.
      - name: Test the tokens (--features avx512)
        run: cargo test --release --features avx512 --lib simd

      # The kernel's copies with Dekker's products, on the runner's CPU:
      # `--cfg fushimi_force_no_fma` makes the kernel take them on any CPU.
      - name: Test the kernel without FMA (--cfg fushimi_force_no_fma)
        run: cargo test --release --lib dyadic
        env:
          RUSTFLAGS: -Ctarget-cpu=x86-64 --cfg fushimi_force_no_fma -Dwarnings

      # The same tests in QEMU's user mode, emulating a Nehalem, which has neither
      # FMA nor AVX: the kernel detects that and takes the same copies, and an FMA
      # or AVX instruction that runs, as in a copy compiled with `fma` reached
      # without the check, ends the tests with SIGILL. `-cpu` is needed, as QEMU's
      # default model, `max`, has FMA. `ulimit -c 0` keeps QEMU from writing its
      # own core file into the working directory on SIGILL.
      - name: Test the kernel without FMA (QEMU, Nehalem)
        run: |
          cargo test --release --lib --no-run
          ulimit -c 0
          cargo test --release --lib dyadic
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: qemu-x86_64 -cpu Nehalem

      # The same in a build for a Nehalem, whose `Interval` uses the `sse42`
      # backend.
      - name: Test the kernel without FMA (QEMU, Nehalem, target Nehalem)
        run: |
          cargo test --release --lib --no-run
          ulimit -c 0
          cargo test --release --lib dyadic
        env:
          RUSTFLAGS: -Ctarget-cpu=nehalem -Dwarnings
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: qemu-x86_64 -cpu Nehalem

      - name: Clippy
        run: |
          cargo clippy --all-targets
          cargo clippy --all-targets --features avx512

      # The newest versions of some dependencies can need a newer Rust. Pick the
      # newest versions that support the `rust-version` in Cargo.toml.
      - name: Generate lockfile (MSRV)
        run: cargo +stable --config 'resolver.incompatible-rust-versions="fallback"' generate-lockfile

      - name: Check (MSRV)
        run: cargo +1.85.0 check --all-targets

  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/gmp-mpfr-sys
          key: ${{ env.GITHUB_JOB }}-${{ secrets.CACHE_VERSION }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            ${{ env.GITHUB_JOB }}-${{ secrets.CACHE_VERSION }}-

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal
          components: llvm-tools-preview

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: Coverage
        run: cargo llvm-cov

  msrv:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/gmp-mpfr-sys
          key: ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.85.0
          override: true
          profile: minimal

      # The newest versions of some dependencies can need a newer Rust. Pick the
      # newest versions that support the `rust-version` in Cargo.toml.
      - name: Generate lockfile
        run: cargo +stable --config 'resolver.incompatible-rust-versions="fallback"' generate-lockfile

      - uses: Swatinem/rust-cache@v2

      # No step in this job sets `-Ctarget-feature=+avx512f`: before 1.89 rustc
      # does not report `avx512f` to `cfg(target_feature)`, so `src/simd/x86_64.rs`
      # would select the `fma` backend, which `Check` checks already. Nor does a
      # step enable the feature `avx512`, which needs 1.89. The `avx512f` job
      # checks and lints that backend, and the feature, on 1.89 in every run; its
      # tests run only on a runner with AVX-512F: as the build's backend in the
      # `build` job, on nightly, and as that of `V4` there and in the `baseline`
      # job.
      - name: Check
        run: cargo check --all-targets

      - name: Check (target Nehalem)
        run: cargo check --all-targets
        env:
          RUSTFLAGS: -Ctarget-cpu=nehalem -Dwarnings
          RUSTDOCFLAGS: -Ctarget-cpu=nehalem -Dwarnings

      - name: Check (--no-default-features)
        run: cargo check --no-default-features --all-targets

  # This job checks and lints the `avx512f` backend as the build's backend and,
  # with the feature `avx512`, as that of the token `V4`. It runs on 1.89, not on
  # the MSRV, 1.85: 1.89 is the first stable Rust with the AVX-512 target
  # features, which both need. It runs nothing built with `+avx512f`, so the
  # runner needs no AVX-512F.
  avx512f:
    runs-on: ubuntu-latest

    # The workflow's `RUSTFLAGS` with `+avx512f`, written out because a job's `env`
    # cannot read the `env` context. `cargo check` and `cargo clippy` below get
    # `--target x86_64-unknown-linux-gnu`, which keeps these flags away from build
    # scripts: built with them, a build script can die with SIGILL on a runner
    # without AVX-512F.
    env:
      RUSTFLAGS: -Ctarget-cpu=haswell -Dwarnings -Ctarget-feature=+avx512f

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/gmp-mpfr-sys
          key: ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.89.0
          override: true
          profile: minimal
          components: clippy

      # Resolve dependencies as the `msrv` job does, preferring releases that
      # support the `rust-version` in Cargo.toml to the newest ones, which may
      # need a Rust newer than 1.89.
      - name: Generate lockfile
        run: cargo +stable --config 'resolver.incompatible-rust-versions="fallback"' generate-lockfile

      - uses: Swatinem/rust-cache@v2

      # `src/simd/x86_64.rs`, which the steps below compile, selects the `avx512f`
      # backend exactly when rustc reports this target feature.
      - name: Check that `avx512f` is selected
        shell: bash
        run: |
          rustc --version
          rustc --print cfg $RUSTFLAGS --target x86_64-unknown-linux-gnu | grep -x 'target_feature="avx512f"'

      - name: Check
        run: |
          cargo check --all-targets --target x86_64-unknown-linux-gnu
          cargo check --all-targets --features avx512 --target x86_64-unknown-linux-gnu

      - name: Clippy
        run: |
          cargo clippy --all-targets --target x86_64-unknown-linux-gnu
          cargo clippy --all-targets --features avx512 --target x86_64-unknown-linux-gnu

      # Without `+avx512f`, the feature `avx512` compiles the `avx512f` backend
      # as that of the token `V4`, in its copies (`src/simd/token.rs`).
      - name: Check and Clippy (--features avx512, target Haswell)
        run: |
          cargo check --all-targets --features avx512 --target x86_64-unknown-linux-gnu
          cargo clippy --all-targets --features avx512 --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: -Ctarget-cpu=haswell -Dwarnings

  # Windows, with the MSVC toolchain. Cargo.toml gives the dev-dependencies on
  # `rug` and `gmp-mpfr-sys` only for 64-bit Linux and macOS, and the tests that
  # compare with MPFR are compiled under the same `cfg`, so this job builds no
  # GMP or MPFR, and runs the other tests.
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          profile: minimal

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release
