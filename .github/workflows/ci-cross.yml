name: ci-cross

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          profile: minimal
          components: clippy

      - name: Add targets
        run: rustup target add wasm32-unknown-unknown wasm32-wasip1 riscv64gc-unknown-linux-gnu i686-unknown-linux-gnu

      # The 32-bit C library and startup files, which linking for
      # i686-unknown-linux-gnu needs.
      - name: Install gcc-multilib
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-multilib

      - uses: bytecodealliance/actions/wasmtime/setup@v1

      - uses: Swatinem/rust-cache@v2

      # GMP and MPFR are not available for these targets.
      - name: Build (wasm32-unknown-unknown)
        run: cargo build --release --no-default-features --target wasm32-unknown-unknown

      - name: Build (riscv64gc-unknown-linux-gnu)
        run: cargo build --release --no-default-features --target riscv64gc-unknown-linux-gnu

      - name: Clippy (wasm32-unknown-unknown)
        run: cargo clippy --no-default-features --target wasm32-unknown-unknown

      - name: Test (wasm32-wasip1)
        run: cargo test --release --no-default-features --lib --tests --target wasm32-wasip1

      # The `wasm32` backend, which needs the `simd128` target feature.
      - name: Clippy (wasm32-unknown-unknown, simd128)
        run: cargo clippy --no-default-features --target wasm32-unknown-unknown
        env:
          RUSTFLAGS: -Dwarnings -Ctarget-feature=+simd128

      - name: Test (wasm32-wasip1, simd128)
        run: cargo test --release --no-default-features --lib --tests --target wasm32-wasip1
        env:
          RUSTFLAGS: -Dwarnings -Ctarget-feature=+simd128

      # A 32-bit target, on which `usize` has 32 bits and `src/simd.rs` selects the
      # `generic` backend. Cargo.toml gives the dev-dependencies on `rug` and
      # `gmp-mpfr-sys` only for 64-bit Linux and macOS, and the tests that compare
      # with MPFR are compiled under the same `cfg`, so this step runs the others.
      - name: Test (i686-unknown-linux-gnu)
        run: cargo test --release --lib --tests --target i686-unknown-linux-gnu

  # The `aarch64` backend on Linux, under QEMU's user-mode emulation, which
  # honours the rounding mode in FPCR, as the FPCR references of the tests need.
  # ci-aarch64 tests it natively, but on a macOS runner, which sometimes does not
  # start.
  aarch64-qemu:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The cache of ci-x86-64 under another key: a key that exists is not saved
      # again, and that cache has no aarch64 build of GMP and MPFR.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/gmp-mpfr-sys
          key: ${{ runner.os }}-aarch64-${{ secrets.CACHE_VERSION }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-aarch64-${{ secrets.CACHE_VERSION }}-

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          profile: minimal
          components: clippy

      - name: Add targets
        run: rustup target add aarch64-unknown-linux-gnu

      # QEMU, and the cross gcc and C library, which linking and the builds of GMP
      # and MPFR need. gmp-mpfr-sys passes `--host aarch64-unknown-linux-gnu` to
      # their configure scripts, which then look for the tools under that prefix
      # (and otherwise fall back to the host's gcc); Ubuntu names them
      # aarch64-linux-gnu-*.
      - name: Install QEMU and gcc-aarch64-linux-gnu
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-user gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          for t in gcc g++ cpp ar as ld nm objdump ranlib readelf strip; do
            sudo ln -s /usr/bin/aarch64-linux-gnu-$t /usr/local/bin/aarch64-unknown-linux-gnu-$t
          done

      - uses: Swatinem/rust-cache@v2

      # gmp-mpfr-sys refuses to cross-compile without its `force-cross` feature,
      # which the command line enables for the tests' dev-dependency.
      - name: Clippy (aarch64-unknown-linux-gnu)
        run: cargo clippy --all-targets --target aarch64-unknown-linux-gnu --features gmp-mpfr-sys/force-cross

      - name: Test (aarch64-unknown-linux-gnu)
        run: cargo test --release --lib --target aarch64-unknown-linux-gnu --features gmp-mpfr-sys/force-cross
